services:
  - type: web
    name: opic-practice-studio
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: DATABASE_URL
        sync: false # Paste your Neon.tech PostgreSQL connection string here
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: TTS_MODEL
        value: gpt-4o-mini-tts
      - key: SONIOX_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: COMPANY_MAGIC_CODE
        value: OPIC-IH-2026
      - key: ENVIRONMENT
        value: production
