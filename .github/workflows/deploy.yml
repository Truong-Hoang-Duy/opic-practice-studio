name: CI & Auto Deploy to Render

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      clear_cache:
        description: 'Clear Render build cache'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Run Tests & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: backend
        run: |
          pytest backend/app/tests -v

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          npm --prefix frontend ci

      - name: Build Frontend Production Bundle
        run: |
          npm --prefix frontend run build

  trigger-render-deploy:
    name: Trigger Render Deployment
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Deploy via Render Webhook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          CLEAR_CACHE: ${{ inputs.clear_cache }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice ::RENDER_DEPLOY_HOOK_URL is not configured yet in GitHub repository Secrets."
            echo "Render will still auto-deploy via GitHub Git Push integration (autoDeploy: true)."
            echo "To trigger deploys directly from GitHub Actions or re-run on demand with 'Run workflow', add your Deploy Hook URL as RENDER_DEPLOY_HOOK_URL in GitHub repo Settings > Secrets and variables > Actions."
            exit 0
          fi

          HOOK_URL="$RENDER_DEPLOY_HOOK_URL"
          if [ "$CLEAR_CACHE" = "true" ]; then
            if [[ "$HOOK_URL" == *"?"* ]]; then
              HOOK_URL="${HOOK_URL}&clearCache=clear"
            else
              HOOK_URL="${HOOK_URL}?clearCache=clear"
            fi
            echo "Triggering Render deploy with cache clearing enabled..."
          else
            echo "Triggering Render deploy..."
          fi

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$HOOK_URL")
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Deployment successfully triggered on Render! (HTTP $HTTP_STATUS)"
          else
            echo "::error ::Render Deploy Hook returned HTTP $HTTP_STATUS. Please verify your RENDER_DEPLOY_HOOK_URL secret."
            exit 1
          fi
